name: CI

# When to run the workflow
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv sync --group dev

    - name: Run ruff linting
      run: |
        uv run ruff check weather/
        uv run ruff format --check weather/

    - name: Run type checking with basedpyright
      run: |
        uv run basedpyright weather/

    - name: Run tests with coverage
      run: |
        uv run pytest tests/ --cov=weather --cov-report=term-missing -v