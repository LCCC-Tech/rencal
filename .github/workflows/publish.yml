name: Publish package

on:
    release:
        types: [published]

concurrency:
    group: publish-${{ github.event.release.tag_name }}
    cancel-in-progress: false

permissions: {}

jobs:
    build:
        name: Validate release artifacts
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Validate release tag
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: |
                  if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "::error::Release tag must use vX.Y.Z format."
                    exit 1
                  fi

            - name: Check out released source
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  ref: refs/tags/${{ github.event.release.tag_name }}
                  fetch-depth: 0
                  persist-credentials: false

            - name: Verify release is on main
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: |
                  git fetch origin main
                  git merge-base --is-ancestor "$RELEASE_TAG" origin/main

            - name: Install uv
              uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
              with:
                  # Pin the uv CLI so release builds remain reproducible.
                  version: "0.10.8"

            - name: Set up Python
              run: uv python install 3.12

            - name: Install development dependencies
              run: uv sync --locked --group dev

            - name: Verify release version
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: test "$(uv version --short)" = "${RELEASE_TAG#v}"

            - name: Build distributions
              run: uv build --no-sources

            - name: Check distribution contents
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: uv run python scripts/check_distributions.py --version "${RELEASE_TAG#v}"

            - name: Upload distributions
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: python-package-distributions
                  path: dist/

    publish-testpypi:
        name: Publish to TestPyPI
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: test-release
            url: https://test.pypi.org/p/rencal
        permissions:
            id-token: write
        steps:
            - name: Download validated distributions
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: python-package-distributions
                  path: dist/

            - name: Publish distributions to TestPyPI
              uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
              with:
                  repository-url: https://test.pypi.org/legacy/
                  skip-existing: true

    test-install:
        name: Smoke-test TestPyPI installation
        needs: publish-testpypi
        runs-on: ubuntu-latest
        permissions: {}
        steps:
            - name: Install uv
              uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
              with:
                  # Keep the release validation toolchain aligned with build.
                  version: "0.10.8"

            - name: Set up Python
              run: uv python install 3.12

            - name: Install package from TestPyPI
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: |
                  uv venv /tmp/rencal-testpypi-venv --python 3.12
                  uv pip install \
                    --python /tmp/rencal-testpypi-venv/bin/python \
                    --index-url https://test.pypi.org/simple/ \
                    --extra-index-url https://pypi.org/simple/ \
                    "rencal==${RELEASE_TAG#v}"

            - name: Exercise installed package
              run: |
                  /tmp/rencal-testpypi-venv/bin/python -c \
                    "import importlib.metadata, rencal; assert importlib.metadata.version('rencal') == rencal.__version__"

    publish-pypi:
        name: Publish to PyPI
        needs: [build, test-install]
        runs-on: ubuntu-latest
        environment:
            name: release
            url: https://pypi.org/p/rencal
        permissions:
            id-token: write
        steps:
            - name: Download validated distributions
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: python-package-distributions
                  path: dist/

            - name: Publish distributions to PyPI
              uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
              with:
                  skip-existing: true
