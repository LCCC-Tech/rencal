name: Update Documentation AI

on:
    pull_request:
        types: [labeled]

# NOTE: This workflow intentionally does NOT use `pull_request_target`.
# `pull_request_target` runs with a privileged, write-capable token while
# checking out untrusted PR code, which GitHub warns can compromise the
# repository. Instead we split the work into two jobs so that the job which
# processes untrusted PR content (generate) never holds a write credential,
# and the job that writes to the repo (apply) never sees untrusted content
# or the Copilot secret.
#
# Alternative evaluated: GitHub "Agentic Workflows" (Copilot-in-Actions).
# See the PR description for the recorded decision.

# Default to no permissions; each job requests only what it needs.
permissions: {}

jobs:
    # ── Generation ────────────────────────────────────────────────────
    # Processes untrusted PR content with the Copilot agent. Read-only:
    # holds the Copilot credential but NO repository write permission.
    generate:
        if: github.event.label.name == 'generate docs'
        runs-on: ubuntu-latest
        environment: copilot
        timeout-minutes: 20
        permissions:
            contents: read
            pull-requests: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  # Do not leave a credential on disk for the agent to use.
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: "24"

            - name: Install Copilot CLI
              run: npm install -g @github/copilot

            - name: Get list of changed files in PR
              id: pr_files
              env:
                  BASE_REF: ${{ github.base_ref }}
                  HEAD_SHA: ${{ github.sha }}
              run: |
                  git fetch origin "$BASE_REF" --depth=1
                  changed_files=$(git diff --name-status "origin/${BASE_REF}...${HEAD_SHA}" \
                    | awk '$1 == "A" || $1 == "M" {print $2}')

                  if [ -z "$changed_files" ]; then
                    echo "has_files=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "has_files=true" >> "$GITHUB_OUTPUT"
                    {
                      echo "files_list<<EOF"
                      printf '%s\n' "$changed_files"
                      echo "EOF"
                    } >> "$GITHUB_OUTPUT"
                  fi

            - name: Run Copilot docs agent
              if: steps.pr_files.outputs.has_files == 'true'
              env:
                  # Copilot credential lives ONLY in this read-only job and must
                  # have no repository write permission.
                  GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
              run: |
                  files_list=$(printf '%s\n' "${{ steps.pr_files.outputs.files_list }}" | while IFS= read -r file; do [ -n "$file" ] && printf -- "- %s\n" "$file"; done)
                  # Replace `--allow-all-tools` with an explicit, restricted
                  # allow-list. The agent may read files and write docs; it may
                  # not run arbitrary shell commands.
                  copilot --agent docs \
                    --prompt "Review the following changed files for user-facing documentation gaps. Update docs/web/src/content/docs/* if needed. Only edit files under docs/web/src/content/docs/.\n\nChanged files:\n$files_list" \
                    --allow-tool 'write' \
                    --allow-tool 'edit' \
                    --allow-tool 'str_replace_editor' \
                    --deny-tool 'shell'

            - name: Verify only docs content changed
              if: steps.pr_files.outputs.has_files == 'true'
              run: |
                  changed=$(git diff --name-only)
                  if [ -z "$changed" ]; then
                    echo "No documentation updates were produced."
                    echo "has_changes=false" >> "$GITHUB_ENV"
                    exit 0
                  fi

                  echo "Files changed by the agent:"
                  printf '%s\n' "$changed"

                  # Fail if anything outside the docs content directory changed.
                  offending=$(printf '%s\n' "$changed" | grep -v '^docs/web/src/content/docs/' || true)
                  if [ -n "$offending" ]; then
                    echo "::error::Agent modified files outside docs/web/src/content/docs/:"
                    printf '%s\n' "$offending"
                    exit 1
                  fi

                  echo "has_changes=true" >> "$GITHUB_ENV"

            - name: Install docs dependencies
              if: env.has_changes == 'true'
              working-directory: docs/web
              run: npm ci

            - name: Build docs
              if: env.has_changes == 'true'
              working-directory: docs/web
              run: npm run build

            - name: Create patch
              if: env.has_changes == 'true'
              run: git diff -- 'docs/web/src/content/docs/**' > docs.patch

            - name: Upload patch artifact
              if: env.has_changes == 'true'
              uses: actions/upload-artifact@v4
              with:
                  name: docs-patch
                  path: docs.patch
                  retention-days: 1

    # ── Apply ─────────────────────────────────────────────────────────
    # Runs only after generation + validation succeed. Holds `contents: write`
    # but NOT the Copilot secret, and never processes untrusted PR content
    # directly — it only applies a validated patch.
    apply:
        needs: generate
        if: github.event.label.name == 'generate docs'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write

        steps:
            - name: Checkout PR branch
              uses: actions/checkout@v5
              with:
                  ref: ${{ github.head_ref }}
                  fetch-depth: 0

            - name: Download patch artifact
              id: download
              uses: actions/download-artifact@v4
              continue-on-error: true
              with:
                  name: docs-patch

            - name: Apply patch and push
              env:
                  HEAD_REF: ${{ github.head_ref }}
              run: |
                  if [ ! -f docs.patch ]; then
                    echo "No patch produced by generation job — nothing to apply."
                    exit 0
                  fi
                  if [ ! -s docs.patch ]; then
                    echo "Empty patch — nothing to apply."
                    exit 0
                  fi

                  git apply --index docs.patch

                  # Defense in depth: stage only the docs content directory.
                  git reset
                  git add -- 'docs/web/src/content/docs/**'
                  rm -f docs.patch

                  if git diff --cached --quiet; then
                    echo "No documentation updates to commit."
                    exit 0
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git commit -m "docs: update documentation via Copilot"
                  git push origin HEAD:"$HEAD_REF"
