# SECURITY BOUNDARY
#
# This workflow intentionally uses pull_request_target.
#
# GitHub therefore loads this workflow from the protected default branch,
# not from the pull request being processed.
#
# PR content is untrusted input only. Do not build, import, source, execute,
# or otherwise run PR-controlled code in a job with repository secrets or
# a privileged GITHUB_TOKEN.
#
# The use of pull_request_target is explicitly permitted by the repository's
# GitHub Actions event policy.

name: Use AI Agent to Update Documentation

on:
    pull_request_target:
        branches: [main]
        types: [labeled]

# NOTE: This workflow intentionally does NOT use `pull_request_target`.
# `pull_request_target` runs with a privileged, write-capable token while
# checking out untrusted PR code, which GitHub warns can compromise the
# repository. Instead we split the work into two jobs so that the job which
# processes untrusted PR content (generate) never holds a write credential,
# and the job that writes to the repo (apply) never sees untrusted content
# or the Copilot secret.

# Default to no permissions; each job requests only what it needs.
permissions: {}

jobs:
    snapshot:
        name: Snapshot commits for documentation request

        if: >
            github.event.action == 'labeled' &&
            github.event.label.name == 'generate docs'

        runs-on: ubuntu-latest

        permissions: {}

        outputs:
            automation_sha: ${{ steps.statewrite.outputs.automation_sha }} # W: exact reviewed workflow/automation revision
            pr_number: ${{ steps.statewrite.outputs.pr_number }}
            pr_head_sha: ${{ steps.statewrite.outputs.pr_head_sha }} # H: exact PR revision being documented
            pr_base_sha: ${{ steps.statewrite.outputs.pr_base_sha }} # B: exact main tip associated with this PR event
            pr_head_ref: ${{ steps.statewrite.outputs.pr_head_ref }}
            pr_head_repository: ${{ steps.statewrite.outputs.pr_head_repository }}
            pr_head_repository_id: ${{ steps.statewrite.outputs.pr_head_repository_id }}

        steps:
            - name: Record immutable request-time repository state to GITHUB_OUTPUT
              id: statewrite
              shell: bash
              env:
                  AUTOMATION_SHA: ${{ github.workflow_sha }} # W: exact reviewed workflow/automation revision
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }} # H: exact PR revision being documented
                  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }} # B: exact main tip associated with this PR event
                  PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
                  PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
                  PR_HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
              run: |
                  set -euo pipefail

                  printf 'automation_sha=%s\n' "$AUTOMATION_SHA" >> "$GITHUB_OUTPUT"
                  printf 'pr_number=%s\n' "$PR_NUMBER" >> "$GITHUB_OUTPUT"
                  printf 'pr_head_sha=%s\n' "$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
                  printf 'pr_base_sha=%s\n' "$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
                  printf 'pr_head_ref=%s\n' "$PR_HEAD_REF" >> "$GITHUB_OUTPUT"
                  printf 'pr_head_repository=%s\n' "$PR_HEAD_REPOSITORY" >> "$GITHUB_OUTPUT"
                  printf 'pr_head_repository_id=%s\n' "$PR_HEAD_REPOSITORY_ID" >> "$GITHUB_OUTPUT"
    
    # ── Generation ────────────────────────────────────────────────────
    # Processes untrusted PR content with the Copilot agent. Read-only:
    # holds the Copilot credential but NO repository write permission.
    generate:
        needs: snapshot

        runs-on: ubuntu-latest
        environment: copilot
        timeout-minutes: 20

        permissions:
            contents: read
            pull-requests: read

        env:
            AUTOMATION_SHA: ${{ needs.snapshot.outputs.automation_sha }} # W: exact reviewed workflow/automation revision
            PR_NUMBER: ${{ needs.snapshot.outputs.pr_number }}
            PR_HEAD_SHA: ${{ needs.snapshot.outputs.pr_head_sha }} # H: exact PR revision being documented
            PR_BASE_SHA: ${{ needs.snapshot.outputs.pr_base_sha }} # B: exact main tip associated with this PR event
            PR_HEAD_REF: ${{ needs.snapshot.outputs.pr_head_ref }}
            PR_HEAD_REPOSITORY: ${{ needs.snapshot.outputs.pr_head_repository }}
            PR_HEAD_REPOSITORY_ID: ${{ needs.snapshot.outputs.pr_head_repository_id }}
            runs-on: ubuntu-latest
            environment: copilot
            timeout-minutes: 20

        steps:
            - name: Checkout trusted automation at W(ORKFLOW)
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ env.AUTOMATION_SHA }} # W: exact reviewed workflow/automation revision
                  path: automation
                  fetch-depth: 1
                  persist-credentials: false

            - name: Checkout exact PR snapshot at H(EAD) as untrusted data
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: ${{ env.PR_HEAD_REPOSITORY }}
                  ref: ${{ env.PR_HEAD_SHA }} # H: exact PR revision being documented
                  path: pr-source
                  fetch-depth: 0
                  persist-credentials: false

                  # Required by checkout v7 because this is deliberately checking
                  # PR-controlled code from pull_request_target.
                  allow-unsafe-pr-checkout: true

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: "24"

            - name: Install Copilot CLI
              run: npm install -g @github/copilot

            - name: Get list of changed files in PR
              id: pr_files
              env:
                  BASE_REF: ${{ github.base_ref }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  git fetch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BASE_REF" --depth=1
                  changed_files=$(git diff --name-status "origin/${BASE_REF}...${HEAD_SHA}" \
                    | awk '$1 ~ /^R/ || $1 ~ /^C/ {print $3} $1 !~ /^R/ && $1 !~ /^C/ {print $2}')

                  if [ -z "$changed_files" ]; then
                    echo "has_files=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "has_files=true" >> "$GITHUB_OUTPUT"
                    {
                      echo "files_list<<EOF"
                      printf '%s\n' "$changed_files"
                      echo "EOF"
                    } >> "$GITHUB_OUTPUT"
                  fi

            - name: Run Copilot docs agent
              if: steps.pr_files.outputs.has_files == 'true'
              env:
                  # Copilot credential lives ONLY in this read-only job and must
                  # have no repository write permission.
                  GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
              run: |
                  files_list=$(printf '%s\n' "${{ steps.pr_files.outputs.files_list }}" | while IFS= read -r file; do [ -n "$file" ] && printf -- "- %s\n" "$file"; done)
                  # Replace `--allow-all-tools` with an explicit, restricted
                  # allow-list. The agent may read files and write docs, and
                  # may use only the read-only inspection commands it needs.
                  copilot --agent docs \
                    --prompt "Review the following changed files for user-facing documentation gaps. Update docs/web/src/content/docs/* if needed. Only edit files under docs/web/src/content/docs/.\n\nChanged files:\n$files_list" \
                    --allow-tool 'write' \
                    --allow-tool 'edit' \
                    --allow-tool 'str_replace_editor' \
                    --allow-tool 'glob' \
                    --allow-tool 'grep' \
                    --allow-tool 'shell(cd)' \
                    --allow-tool 'shell(grep)' \
                    --allow-tool 'shell(git diff)' \
                    --allow-tool 'shell(git log)' \
                    --allow-tool 'shell(mkdir)'

            - name: Verify only docs content changed
              if: steps.pr_files.outputs.has_files == 'true'
              run: |
                  changed=$( { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u )
                  if [ -z "$changed" ]; then
                    echo "No documentation updates were produced."
                    echo "has_changes=false" >> "$GITHUB_ENV"
                    exit 0
                  fi

                  echo "Files changed by the agent:"
                  printf '%s\n' "$changed"

                  # Fail if anything outside the docs content directory changed,
                  # including untracked files created by the agent.
                  offending=$(printf '%s\n' "$changed" | grep -v '^docs/web/src/content/docs/' || true)
                  if [ -n "$offending" ]; then
                    echo "::error::Agent modified files outside docs/web/src/content/docs/:"
                    printf '%s\n' "$offending"
                    exit 1
                  fi

                  echo "has_changes=true" >> "$GITHUB_ENV"

            - name: Install docs dependencies
              if: env.has_changes == 'true'
              working-directory: docs/web
              run: npm ci

            - name: Build docs
              if: env.has_changes == 'true'
              working-directory: docs/web
              run: npm run build

            - name: Create patch
              if: env.has_changes == 'true'
              run: |
                  # Stage only validated documentation changes so new files and
                  # file metadata are included in the artifact patch.
                  git add --all -- docs/web/src/content/docs/
                  git diff --cached --binary -- 'docs/web/src/content/docs/**' > docs.patch

            - name: Upload patch artifact
              if: env.has_changes == 'true'
              uses: actions/upload-artifact@v4
              with:
                  name: docs-patch
                  path: docs.patch
                  retention-days: 1

    # ── Apply ─────────────────────────────────────────────────────────
    # Runs only after generation + validation succeed. Holds `contents: write`
    # but NOT the Copilot secret, and never processes untrusted PR content
    # directly — it only applies a validated patch.
    apply:
        needs: generate
        if: github.event.label.name == 'generate docs'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write

        steps:
            - name: Checkout PR branch
              uses: actions/checkout@v5
              with:
                  ref: ${{ github.head_ref }}
                  fetch-depth: 0

            - name: Download patch artifact
              id: download
              uses: actions/download-artifact@v4
              continue-on-error: true
              with:
                  name: docs-patch

            - name: Apply patch and push
              env:
                  HEAD_REF: ${{ github.head_ref }}
              run: |
                  if [ ! -f docs.patch ]; then
                    echo "No patch produced by generation job — nothing to apply."
                    exit 0
                  fi
                  if [ ! -s docs.patch ]; then
                    echo "Empty patch — nothing to apply."
                    exit 0
                  fi

                  # Validate the patch applies cleanly before touching the tree.
                  git apply --check docs.patch
                  git apply --index docs.patch

                  # Defense in depth: stage only the docs content directory.
                  git reset
                  git add -- 'docs/web/src/content/docs/**'
                  rm -f docs.patch

                  if git diff --cached --quiet; then
                    echo "No documentation updates to commit."
                    exit 0
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git commit -m "docs: update documentation via Copilot"
                  git push origin HEAD:"$HEAD_REF"
