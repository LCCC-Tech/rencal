name: Publish to PyPI

on:
    workflow_run:
        workflows: ["Run checks"]
        types: [completed]

concurrency:
    group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
    cancel-in-progress: false

jobs:
    # ── Release pipeline ───────────────────────────────────────────────
    tag:
        name: Create release tag
        if: >
            false &&
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_branch == 'main'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        outputs:
            tag: ${{ steps.version.outputs.tag }}
            version: ${{ steps.version.outputs.version }}

        steps:
            - name: Check out repository
              uses: actions/checkout@v5
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}
                  fetch-depth: 0

            - name: Determine next version
              id: version
              shell: bash
              run: |
                  python3 - <<'PY'
                  import os, re, subprocess

                  semver = re.compile(r"^v(\d+)\.(\d+)\.(\d+)$")

                  def parse(tag: str):
                      m = semver.match(tag)
                      return tuple(map(int, m.groups()))

                  # 1) If HEAD already has a release tag, reuse the highest one
                  head_tags = subprocess.check_output(
                      ["git", "tag", "--points-at", "HEAD"], text=True,
                  ).splitlines()

                  head_release_tags = sorted(
                      [t for t in head_tags if semver.match(t)], key=parse,
                  )

                  if head_release_tags:
                      tag = head_release_tags[-1]
                      version = tag[1:]
                  else:
                      # 2) Find the latest release tag in the repo and bump patch
                      all_tags = subprocess.check_output(
                          ["git", "tag", "--list", "v*"], text=True,
                      ).splitlines()

                      release_tags = [t for t in all_tags if semver.match(t)]

                      if release_tags:
                          major, minor, patch = parse(sorted(release_tags, key=parse)[-1])
                          version = f"{major}.{minor}.{patch + 1}"
                      else:
                          version = "0.0.1"

                      tag = f"v{version}"

                  with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                      fh.write(f"tag={tag}\n")
                      fh.write(f"version={version}\n")
                  PY

            - name: Create and push tag (if needed)
              env:
                  TAG: ${{ steps.version.outputs.tag }}
              run: |
                  if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
                    echo "Tag ${TAG} already exists on origin — skipping."
                    exit 0
                  fi
                  git config user.name  "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git tag -a "${TAG}" -m "Release ${TAG}"
                  git push origin "refs/tags/${TAG}"

    build-main:
        name: Build distributions
        if: >
            false &&
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_branch == 'main'
        needs: tag
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Check out repository
              uses: actions/checkout@v5
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}
                  fetch-depth: 0
                  fetch-tags: true

            - name: Install uv
              uses: astral-sh/setup-uv@v3
              with:
                  version: "latest"

            - name: Set up Python
              run: uv python install 3.12

            - name: Inject release version into pyproject.toml
              env:
                  VERSION: ${{ needs.tag.outputs.version }}
              run: |
                  sed -i "s/^version = .*/version = \"${VERSION}\"/" pyproject.toml
                  echo "Building version ${VERSION}"
                  grep '^version' pyproject.toml

            - name: Build wheel and sdist
              run: uv build

            - name: Upload distributions
              uses: actions/upload-artifact@v4
              with:
                  name: python-package-distributions
                  path: dist/

    publish-to-testpypi:
        name: Publish to TestPyPI
        if: >
            false &&
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_branch == 'main'
        needs: [build-main]
        runs-on: ubuntu-latest
        environment:
            name: testpypi
            url: https://test.pypi.org/project/rencal/
        permissions:
            id-token: write

        steps:
            - name: Download distributions
              uses: actions/download-artifact@v4
              with:
                  name: python-package-distributions
                  path: dist/

            - name: Publish to TestPyPI
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  repository-url: https://test.pypi.org/legacy/
                  skip-existing: true

    smoke-test-testpypi:
        name: Smoke test TestPyPI install
        if: >
            false &&
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_branch == 'main'
        needs: [tag, publish-to-testpypi]
        runs-on: ubuntu-latest

        steps:
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"

            - name: Install release from TestPyPI
              env:
                  VERSION: ${{ needs.tag.outputs.version }}
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install \
                    --index-url https://test.pypi.org/simple/ \
                    --extra-index-url https://pypi.org/simple/ \
                    "rencal==${VERSION}"

            - name: Verify package imports
              run: python -c "import rencal; print('Installed rencal successfully')"

    publish-to-pypi:
        name: Publish to PyPI
        if: >
            false &&
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_branch == 'main'
        needs: [smoke-test-testpypi]
        runs-on: ubuntu-latest
        environment:
            name: pypi
            url: https://pypi.org/project/rencal/
        permissions:
            id-token: write

        steps:
            - name: Download distributions
              uses: actions/download-artifact@v4
              with:
                  name: python-package-distributions
                  path: dist/

            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
