[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[project]
name = "weather-lccc"
version = "0.0.0"  # placeholder — CI injects the real version from the git tag before building
description = "Weather-to-power calibration and Monte Carlo scrambler for renewable energy applications"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
authors = [
    {name = "The Low Carbon Contracts Company", email = "analytics@lowcarboncontracts.uk"}
]
maintainers = [
    {name = "The Low Carbon Contracts Company", email = "analytics@lowcarboncontracts.uk"}
]
keywords = [
    "weather",
    "forecasting",
    "renewable energy",
    "wind power",
    "solar power",
    "era5",
    "monte carlo",
    "calibration",
    "climate"
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Utilities"
]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.0.0",
    "netCDF4>=1.5.0",
    "xarray>=0.19.0",
    "pytz>=2021.1",
    "requests>=2.25.0",
    "polars>=1.8.2",
    "pydantic>=2.10.6",
    "pyodbc>=4.0.0",
    "cdsapi>=0.6.0",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1.0",
    "zarr>=2.16.1",
    "tqdm>=4.62.0",
    "pyarrow>=22.0.0",
]

[dependency-groups]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "ruff>=0.8.0",
    "basedpyright>=1.0.0",
    "pre-commit>=2.15.0",
    "build>=1.0.0"
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
    "myst-parser>=0.15.0",
    "sphinx-autoapi>=1.8.0"
]
azure = [
    "azure-storage-blob>=12.0.0",
    "azure-identity>=1.7.0"
]
notebook = [
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "plotly>=5.0.0"
]

[project.urls]
Homepage = "https://github.com/LCCC-Tech/weather"
Documentation = "https://weather-lccc.readthedocs.io/"
Repository = "https://github.com/LCCC-Tech/weather.git"
"Bug Tracker" = "https://github.com/LCCC-Tech/weather/issues"
Changelog = "https://github.com/LCCC-Tech/weather/blob/main/CHANGELOG.md"

[project.scripts]
weather-calibrate = "weather.calibration.cli:main"
weather-forecast = "weather.models.cli:main"

[tool.uv.build-backend]
module-name = "weather"
module-root = ""

[tool.basedpyright]
include = ["weather"]
exclude = [".venv", "build", "dist", "weather/simulation/intermittent_bucketer.py", "weather/core/bucketed_data.py",]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"  # Changed from strict to basic to reduce false positives
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedClass = false  # Reduce noise for now
reportUnusedFunction = false  # Reduce noise for now
reportUnusedVariable = true
# Less strict about third-party library types
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
# Disable overly strict argument type checking for third-party libraries
reportArgumentType = false
# Additional settings to help with import resolution
extraPaths = ["."]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # Do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint.isort]
known-first-party = ["weather"]

# pytest configuration
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore:numpy.*:RuntimeWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["weather"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
