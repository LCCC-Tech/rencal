name: Docs Update (Copilot)

on:
  pull_request:
    branches: [main]

jobs:
  update-docs:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: copilot
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Get list of changed files in PR
        id: pr_files
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          git diff --name-status origin/"${{ github.base_ref }}"..."${{ github.sha }}" \
            | awk '$1 == "A" || $1 == "M" {print $2}' > pr_files.txt

          if [ ! -s pr_files.txt ]; then
            echo "has_files=false" >> $GITHUB_OUTPUT
          else
            echo "has_files=true" >> $GITHUB_OUTPUT
            echo "files=$(paste -sd, pr_files.txt)" >> $GITHUB_OUTPUT
          fi

      - name: Run Copilot docs agent
        if: steps.pr_files.outputs.has_files == 'true'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          files_list=$(while IFS= read -r file; do [ -n "$file" ] && printf -- "- %s\n" "$file"; done < pr_files.txt)
          copilot --agent docs --prompt "Review the following changed files for user-facing documentation gaps. Update docs/web/src/content/docs/* if needed.\n\nChanged files:\n$files_list" --allow-all-tools

      - name: Commit and push docs changes
        if: steps.pr_files.outputs.has_files == 'true'
        run: |
          git checkout "${{ github.head_ref }}"
          if ! git diff --exit-code; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "docs: update documentation via Copilot"
            git push
          else
            echo "No documentation updates to commit."
          fi
