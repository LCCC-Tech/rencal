name: Update Documentation AI

on:
    push:
        branches: [dev]

jobs:
    update-docs:
        if: github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        environment: copilot
        permissions:
            contents: write
            pull-requests: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: "24"

            - name: Install Copilot CLI
              run: npm install -g @github/copilot

            - name: Get list of changed files in PR
              id: pr_files
              run: |
                  git fetch origin "${{ github.base_ref }}" --depth=1
                  changed_files=$(git diff --name-status origin/"${{ github.base_ref }}"..."${{ github.sha }}" \
                    | awk '$1 == "A" || $1 == "M" {print $2}')

                  if [ -z "$changed_files" ]; then
                    echo "has_files=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "has_files=true" >> "$GITHUB_OUTPUT"
                    {
                      echo "files_list<<EOF"
                      printf '%s\n' "$changed_files"
                      echo "EOF"
                    } >> "$GITHUB_OUTPUT"
                  fi

            - name: Run Copilot docs agent
              if: steps.pr_files.outputs.has_files == 'true'
              env:
                  GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
              run: |
                  files_list=$(printf '%s\n' "${{ steps.pr_files.outputs.files_list }}" | while IFS= read -r file; do [ -n "$file" ] && printf -- "- %s\n" "$file"; done)
                  copilot --agent docs --prompt "Review the following changed files for user-facing documentation gaps. Update docs/web/src/content/docs/* if needed.\n\nChanged files:\n$files_list" --allow-all-tools

            - name: Commit and push docs changes
              if: steps.pr_files.outputs.has_files == 'true'
              run: |
                  git checkout "${{ github.head_ref }}"
                  if ! git diff --exit-code; then
                    git config user.name "github-actions[bot]"
                    git config user.email "github-actions[bot]@users.noreply.github.com"
                    git add .
                    git commit -m "docs: update documentation via Copilot"
                    git push
                  else
                    echo "No documentation updates to commit."
                  fi
