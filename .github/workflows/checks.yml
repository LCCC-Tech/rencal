name: Run checks

env:
    UV_VERSION: "0.10.8"

permissions:
    contents: read

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    test:
        name: Lint, typecheck & test
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ["3.12"]

        steps:
            - name: Checkout code
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
              with:
                  # Keep CI aligned with the pinned release toolchain.
                  version: ${{ env.UV_VERSION }}

            - name: Set up Python
              run: uv python install ${{ matrix.python-version }}

            - name: Install dependencies
              run: uv sync --locked --group dev

            - name: Run ruff linting and formatting checks
              run: |
                  uv run ruff format --check rencal/ tests/ scripts/
                  uv run ruff check rencal/ tests/ scripts/

            - name: Run type checking with basedpyright
              run: uv run basedpyright --warnings

            - name: Run tests with coverage
              run: uv run pytest tests/ -v
